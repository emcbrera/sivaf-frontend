<div class="app-layout" [class.app-layout--sidebar-closed]="!isSidebarOpen">
  <app-sidebar
    id="app-sidebar"
    class="app-sidebar"
    [class.app-sidebar--collapsed]="!isSidebarOpen">
  </app-sidebar>

  <div class="app-main">
    <app-header
      class="app-header"
      [isSidebarOpen]="isSidebarOpen"
      (toggleMenuSidebar)="onToggleSidebar()">
    </app-header>

    <main class="app-content">
      <router-outlet></router-outlet>
    </main>

    <app-footer class="app-footer"></app-footer>
  </div>
</div>
