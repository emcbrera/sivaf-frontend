<main class="login-page" id="recover-password">
  <!-- Lado izquierdo: imagen (placeholder hasta que tengas el collage) -->
  <section class="login-visual" aria-label="Imagen institucional">
    <img src="assets/images/imagen_login.png" alt="Escalafón">
  </section>

  <!-- Lado derecho: formulario -->
  <section class="login-panel">
    <form
      class="login-form"
      [formGroup]="recoverForm"
      (ngSubmit)="recuperar()"
      novalidate>

      <div class="login-form__logo">
        <img src="assets/icons/logo.png" alt="Escalafón">
      </div>

      <header class="login-form__header">
        <h1>Recuperar contraseña</h1>
      </header>

      <div class="login-form__body">
        <!-- Campo de usuario -->
        <div class="form-field">
          <label for="usuario" class="form-label">Usuario academusoft</label>

          <div class="input-wrapper">
            <span class="input-icon" aria-hidden="true">
              <img src="assets/icons/usuario.svg" alt="">
            </span>

            <input
              id="usuario"
              type="text"
              class="form-control"
              formControlName="usuario"
              autocomplete="username"
              placeholder="Usuario academusoft"
              [readOnly]="isLoading()"
              [attr.aria-invalid]="recoverForm.controls.usuario.invalid && recoverForm.controls.usuario.touched"
              aria-describedby="usuarioError">
          </div>

          @if (recoverForm.controls.usuario.hasError('required') && recoverForm.controls.usuario.touched) {
            <p id="usuarioError" class="field-error">El usuario es obligatorio.</p>
          }
        </div>

        <!-- Botón Recuperar -->
        <button
          type="submit"
          class="app-button app-button--primary btn-login"
          [disabled]="isLoading()"
          [attr.aria-busy]="isLoading()">
          {{ isLoading() ? 'Enviando...' : 'Recuperar' }}
        </button>

        @if (feedback(); as currentFeedback) {
          @if (currentFeedback.type === 'error') {
          <p
            class="request-feedback request-feedback--error"
            role="alert">
            {{ currentFeedback.message }}
          </p>
          }
        }

        <!-- Botón Regresar (vuelve al login) -->
        <a
          routerLink="/login"
          class="app-button app-button--primary btn-login btn-regresar">
          Regresar
        </a>
      </div>
    </form>
  </section>
</main>
